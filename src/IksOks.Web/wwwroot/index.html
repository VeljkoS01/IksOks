<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IksOks</title>

    <link rel="stylesheet" href="/css/site.css">
</head>

<body>
    <main id="auth-page" class="auth-page">
        <section class="auth-card">
            <h1>IksOks</h1>
            <p class="subtitle">
                Prijavi se ili napravi novi nalog.
            </p>

            <div class="auth-tabs">
                <button id="login-tab"
                        class="tab-button active"
                        type="button">
                    Prijava
                </button>

                <button id="register-tab"
                        class="tab-button"
                        type="button">
                    Registracija
                </button>
            </div>

            <form id="auth-form">
                <div class="form-field">
                    <label for="username">
                        Korisničko ime
                    </label>

                    <input id="username"
                           name="username"
                           type="text"
                           autocomplete="username"
                           required>
                </div>

                <div class="form-field">
                    <label for="password">
                        Lozinka
                    </label>

                    <input id="password"
                           name="password"
                           type="password"
                           autocomplete="current-password"
                           required>
                </div>

                <button id="submit-button"
                        class="primary-button"
                        type="submit">
                    Uloguj se
                </button>
            </form>

            <p id="message"
               class="message"
               aria-live="polite">
            </p>
        </section>
    </main>

    <main id="app-page" class="app-page hidden">
        <header class="app-header">
            <div>
                <h1>IksOks</h1>
                <p id="welcome-text" class="welcome-text"></p>
            </div>

            <button id="logout-button"
                    class="secondary-button"
                    type="button">
                Odjavi se
            </button>
        </header>

        <div class="dashboard-grid">
            <section class="dashboard-card">
                <h2>Napravi meč</h2>

                <form id="create-match-form">
                    <div class="form-field">
                        <label for="board-size">
                            Veličina table
                        </label>

                        <input id="board-size"
                               type="number"
                               min="3"
                               max="10"
                               value="3"
                               required>
                    </div>

                    <div class="form-field">
                        <label for="win-length">
                            Polja za pobedu
                        </label>

                        <input id="win-length"
                               type="number"
                               min="3"
                               max="3"
                               value="3"
                               required>
                    </div>

                    <button class="primary-button"
                            type="submit">
                        Napravi meč
                    </button>
                </form>

                <p id="match-message"
                   class="message"
                   aria-live="polite">
                </p>
            </section>

            <section class="dashboard-card">
                <div class="matches-header">
                    <h2>Dostupni mečevi</h2>

                    <button id="refresh-matches-button"
                            class="secondary-button"
                            type="button">
                        Osveži
                    </button>
                </div>

                <div id="matches-list" class="matches-list"></div>
            </section>
        </div>
    </main>

    <script src="/js/auth.js"></script>
</body>
</html>
