<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IksOks</title>

    <link rel="stylesheet" href="/css/site.css">
</head>

<body>
    <main id="auth-page" class="auth-page">
        <section class="auth-card">
            <h1>IksOks</h1>
            <p class="subtitle">
                Prijavi se ili napravi novi nalog.
            </p>

            <div class="auth-tabs">
                <button id="login-tab"
                        class="tab-button active"
                        type="button">
                    Prijava
                </button>

                <button id="register-tab"
                        class="tab-button"
                        type="button">
                    Registracija
                </button>
            </div>

            <form id="auth-form">
                <div class="form-field">
                    <label for="username">
                        Korisničko ime
                    </label>

                    <input id="username"
                           name="username"
                           type="text"
                           autocomplete="username"
                           required>
                </div>

                <div class="form-field">
                    <label for="password">
                        Lozinka
                    </label>

                    <input id="password"
                           name="password"
                           type="password"
                           autocomplete="current-password"
                           required>
                </div>

                <button id="submit-button"
                        class="primary-button"
                        type="submit">
                    Uloguj se
                </button>
            </form>

            <p id="message"
               class="message"
               aria-live="polite">
            </p>
        </section>
    </main>

    <main id="app-page" class="app-page hidden">
        <header class="app-header">
            <div>
                <h1>IksOks</h1>
                <p id="welcome-text" class="welcome-text"></p>
            </div>

            <button id="logout-button"
                    class="secondary-button"
                    type="button">
                Odjavi se
            </button>
        </header>
        <section id="lobby-view">
            <nav class="lobby-nav"
                 aria-label="Glavna navigacija">
                <button class="lobby-nav-button active"
                        data-lobby-target="play"
                        type="button">
                    Igraj
                </button>

                <button class="lobby-nav-button"
                        data-lobby-target="matches"
                        type="button">
                    Moji mečevi
                </button>

                <button class="lobby-nav-button"
                        data-lobby-target="live"
                        type="button">
                    Uživo
                </button>

                <button class="lobby-nav-button"
                        data-lobby-target="ranking"
                        type="button">
                    Rang lista
                </button>

                <button class="lobby-nav-button"
                        data-lobby-target="store"
                        type="button">
                    Prodavnica
                </button>

                <button class="lobby-nav-button"
                        data-lobby-target="profile"
                        type="button">
                    Profil
                </button>
            </nav>
            <div class="dashboard-grid">
                <section class="dashboard-card" data-lobby-page="play">
                    <h2>Napravi meč</h2>

                    <form id="create-match-form">
                        <div class="form-field">
                            <label for="match-mode">
                                Režim igre
                            </label>

                            <select id="match-mode">
                                <option value="Classic">
                                    Classic
                                </option>

                                <option value="ConnectK">
                                    Connect-K
                                </option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="board-size">
                                Veličina table
                            </label>

                            <input id="board-size"
                                   type="number"
                                   min="3"
                                   max="10"
                                   value="3"
                                   required>
                        </div>

                        <div class="form-field">
                            <label for="win-length">
                                Polja za pobedu
                            </label>

                            <input id="win-length"
                                   type="number"
                                   min="3"
                                   max="3"
                                   value="3"
                                   required>
                        </div>
                        <label for="match-visibility">
                            Vidljivost meča
                        </label>

                        <select id="match-visibility">
                            <option value="Public">
                                Javan
                            </option>

                            <option value="Private">
                                Privatan
                            </option>
                        </select>
                        <button class="primary-button"
                                type="submit">
                            Napravi meč
                        </button>
                    </form>

                    <p id="match-message"
                       class="message"
                       aria-live="polite">
                    </p>
                </section>

                <section class="dashboard-card" data-lobby-page="play">
                    <div class="matches-header">
                        <h2>Dostupni mečevi</h2>

                        <button id="refresh-matches-button"
                                class="secondary-button"
                                type="button">
                            Osveži
                        </button>
                    </div>

                    <div id="matches-list" class="matches-list"></div>
                    <div class="private-match-join">
                        <label for="private-match-code">
                            Kod privatnog meča
                        </label>

                        <div class="private-match-join-row">
                            <input id="private-match-code"
                                   type="text"
                                   maxlength="8"
                                   autocomplete="off"
                                   placeholder="npr. 7FA2C91D">

                            <button id="join-private-match-button"
                                    class="secondary-button"
                                    type="button">
                                Pridruži se kodom
                            </button>
                        </div>

                        <p id="private-match-message"
                           class="message">
                        </p>
                    </div>
                </section>
            </div>
            <div class="personal-matches-grid">
                <section class="dashboard-card" data-lobby-page="matches">
                    <div class="matches-header">
                        <h2>Moji aktivni mečevi</h2>

                        <button id="refresh-my-matches-button"
                                class="secondary-button"
                                type="button">
                            Osveži
                        </button>
                    </div>

                    <div id="active-matches-list"
                         class="matches-list">
                    </div>
                </section>
                <section class="dashboard-card" data-lobby-page="live">
                    <div class="section-header">
                        <h2>Mečevi uživo</h2>

                        <button id="refresh-live-matches-button"
                                type="button"
                                class="secondary-button">
                            Osveži
                        </button>
                    </div>

                    <div id="live-matches-list"
                         class="matches-list">
                    </div>
                </section>
                <section class="dashboard-card" data-lobby-page="matches">
                    <h2>Istorija mečeva</h2>

                    <div id="match-history-list"
                         class="matches-list">
                    </div>
                </section>
            </div>
            <div class="profile-leaderboard-grid">
                <section id="profile-card" class="dashboard-card" data-lobby-page="profile">
                    <div class="matches-header">
                        <h2>Moj profil</h2>

                        <button id="refresh-profile-button"
                                class="secondary-button"
                                type="button">
                            Osveži
                        </button>
                    </div>

                    <div id="profile-summary"
                         class="profile-summary">
                    </div>
                </section>

                <section class="dashboard-card" data-lobby-page="ranking">
                    <div class="matches-header">
                        <h2>Rang lista</h2>

                        <button id="refresh-leaderboard-button"
                                class="secondary-button"
                                type="button">
                            Osveži
                        </button>
                    </div>

                    <div id="leaderboard-list"
                         class="leaderboard-list">
                    </div>
                </section>
            </div>
            <section class="dashboard-card store-card" data-lobby-page="store">
                <div class="matches-header">
                    <div>
                        <h2>Prodavnica</h2>
                        <p id="token-balance"
                           class="token-balance">
                            Tokeni: -
                        </p>
                    </div>

                    <button id="refresh-store-button"
                            class="secondary-button"
                            type="button">
                        Osveži
                    </button>
                    <button id="clear-border-button"
                            class="secondary-button"
                            type="button">
                        Bez okvira
                    </button>
                </div>

                <div id="store-list"
                     class="store-list">
                </div>
            </section>
        </section>
        <section id="match-view" class="match-view hidden">
            <div class="match-header">
                <div>
                    <h2 id="match-title">IksOks meč</h2>
                    <p id="match-status" class="match-status"></p>
                    <p id="match-join-code" class="match-join-code hidden"></p>
                    <p id="turn-timer" class="turn-timer"></p>
                    <p id="match-control-role" class="match-control-role"></p>
                </div>

                <div id="player-badge" class="match-symbol">
                    Tvoj znak:
                    <strong id="player-symbol">-</strong>
                </div>
            </div>

            <div id="game-board"
                 class="game-board"
                 aria-label="IksOks tabla">
            </div>

            <section class="emoji-chat">
                <div class="emoji-chat-header">
                    <strong>Emoji chat</strong>
                </div>

                <div id="emoji-chat-messages"
                     class="emoji-chat-messages"
                     aria-live="polite">
                </div>

                <div id="emoji-chat-actions"
                     class="emoji-chat-actions">
                </div>
            </section>

            <p id="game-message"
               class="message"
               aria-live="polite">
            </p>
            <div id="match-controls"
                 class="match-controls">
            </div>

            <button id="back-to-lobby-button"
                    class="secondary-button hidden"
                    type="button">
                Nazad u lobby
            </button>
        </section>
    </main>

    <script src="/lib/signalr/signalr.min.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
